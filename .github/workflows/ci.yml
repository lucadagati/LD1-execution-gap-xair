name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Unit tests + E0 lifecycle
        run: |
          pytest tests/ -v
          python experiments/run_e0_lifecycle.py

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XAIR deps
        run: pip install -e ".[dev]"
      - name: Start XAIR + HTTP adapter
        env:
          XAIR_URL: http://127.0.0.1:8080
          XAIR_ADAPTER_WEBSOCKET: "0"
        run: |
          uvicorn xair.adapters.http_server:app --host 127.0.0.1 --port 8080 &
          echo $! > /tmp/xair.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/v1/metrics && break
            sleep 1
          done
          python scripts/adaptix_quest_adapter.py 9091 9092 &
          echo $! > /tmp/adapter.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9092/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/v1/metrics
          curl -sf http://127.0.0.1:9092/health
      - name: Quick experiments
        env:
          XAIR_URL: http://127.0.0.1:8080
        run: |
          python experiments/run_e1_baselines.py --runs 5 --baselines xair direct --seed 1
          python experiments/run_e9_consistency_sweep.py --runs 2 --seed 1
          python experiments/run_e10_toctou.py --runs 5 --seed 1
          python experiments/aggregate_experiment_results.py
          python experiments/plot_results.py --out experiments/plots
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-csv
          path: |
            experiments/results/*.csv
            experiments/results/paper_metrics_summary.json
            experiments/plots/*
      - name: Stop background services
        if: always()
        run: |
          kill "$(cat /tmp/adapter.pid)" 2>/dev/null || true
          kill "$(cat /tmp/xair.pid)" 2>/dev/null || true

  clean-clone-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-clone audit
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: bash scripts/clean_clone_audit.sh /tmp/xair-audit-ci
