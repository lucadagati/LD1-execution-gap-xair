name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Unit tests + E0 lifecycle
        run: |
          pytest tests/ -v
          python experiments/run_e0_lifecycle.py

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XAIR deps
        run: pip install -e ".[dev]"
      - name: Start XAIR + adapter
        run: |
          uvicorn xair.adapters.http_server:app --host 127.0.0.1 --port 8080 &
          sleep 3
          XAIR_URL=http://127.0.0.1:8080 python3 scripts/adaptix_quest_adapter.py 9091 9092 &
          sleep 2
          curl -sf http://127.0.0.1:8080/v1/metrics
          curl -sf http://127.0.0.1:9092/health
      - name: Quick experiments
        run: |
          python experiments/run_e1_baselines.py --runs 5 --baselines xair direct --seed 1
          python experiments/run_e9_consistency_sweep.py --runs 2 --seed 1
          python experiments/run_e10_toctou.py --runs 5 --seed 1
          python experiments/aggregate_experiment_results.py
          python experiments/plot_results.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-csv
          path: |
            experiments/results/*.csv
            experiments/results/paper_metrics_summary.json
            experiments/plots/*

  clean-clone-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-clone audit
        run: bash scripts/clean_clone_audit.sh /tmp/xair-audit-ci
